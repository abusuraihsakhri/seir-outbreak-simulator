services:
  seir-outbreak-simulator:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MODEL_PROVIDER: mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
